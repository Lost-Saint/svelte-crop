name: Quality Gate

on: [pull_request]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Check types and Svelte components
        run: bun run check
      - name: Lint and format check
        run: bun run lint
      - name: Build package
        run: bun run build
      - name: Run unit tests
        run: bun run unit
      - name: Run Playwright tests
        run: bun run e2e
